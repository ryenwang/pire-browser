[workspace]
members = [
  "pire-browser-core",
  "pire-browser-cli",
  "pire-browser-host",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.5"
authors = ["pire-browser contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
aes-gcm = "0.10.3"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
crossbeam-channel = "0.5.15"
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
libc = "0.2.177"
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
